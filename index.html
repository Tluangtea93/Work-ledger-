<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Work Ledger</title>
<style>
:root{
  --bg:#f0f5f4;--card:#ffffff;--ink:#0e2825;--mute:#68807b;--line:#e2eae8;--soft:#f5f9f8;
  --pri:#0f766e;--pri2:#14b8a6;--accent:#f59e0b;
  --Present:#10b981;--Half:#f59e0b;--Absent:#ef4444;--Holiday:#6366f1;--pay:#0ea5e9;
  --shadow:0 1px 2px rgba(14,40,37,.05),0 8px 24px rgba(14,40,37,.07);--r:22px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#091110;--card:#122120;--ink:#e8f3f1;--mute:#8aa39e;--line:#223530;--soft:#0e1a19;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#091110;--card:#122120;--ink:#e8f3f1;--mute:#8aa39e;--line:#223530;--soft:#0e1a19;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
/* header */
.hdr{background:linear-gradient(145deg,#053f3a 0%,#0f766e 52%,#14b8a6 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 26px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
body.t-home .hdr{padding-bottom:92px}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hdr::before{width:230px;height:230px;right:-80px;top:-100px}
.hdr::after{width:160px;height:160px;left:-60px;bottom:-70px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:12px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.acts-h{display:flex;gap:8px}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;height:38px;min-width:38px;padding:0 11px;border-radius:13px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.ib:active{transform:scale(.94)}
.mnav{display:none;align-items:center;justify-content:space-between;margin-top:18px;position:relative;z-index:1}
body.t-home .mnav,body.t-report .mnav{display:flex}
.mnav button.arr{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.mnav button.arr:active{transform:scale(.9)}
.mnav .lbl{text-align:center;background:none;border:0;color:#fff}
.mnav .lbl b{font-size:23px;display:block;font-weight:800;letter-spacing:-.2px}
.mnav .lbl span{font-size:12px;opacity:.85}
#pageTitle{display:none;margin:16px 0 0;font-size:26px;font-weight:800;position:relative;z-index:1}
body.t-entries #pageTitle,body.t-set #pageTitle{display:block}
/* hero */
.hero{display:none;margin:-70px 16px 0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;z-index:2}
body.t-home .hero{display:block}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.k{font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.v{font-size:36px;font-weight:800;color:var(--pri);margin:3px 0 6px;letter-spacing:-.8px;line-height:1.1}
.delta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mute)}
.delta.up{background:rgba(16,185,129,.14);color:#059669}
.delta.down{background:rgba(239,68,68,.12);color:#dc2626}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.goalbtn{width:58px;height:58px;border-radius:50%;border:2px dashed var(--line);background:none;font-size:22px;flex:none}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini{background:var(--soft);border-radius:15px;padding:11px 6px;text-align:center}
.mini b{display:block;font-size:16px;font-weight:800}
.mini span{font-size:11px;color:var(--mute)}
main{padding:0 16px}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* quick / balance */
.quick{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,rgba(16,185,129,.15),rgba(20,184,166,.12));border:1px dashed var(--Present)}
.quick p{margin:0;flex:1;font-size:14px;font-weight:700;line-height:1.35}
.quick button{background:var(--Present);color:#fff;border:0;padding:12px 14px;border-radius:15px;font-weight:800;box-shadow:0 5px 14px rgba(16,185,129,.4)}
.streak{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,rgba(245,158,11,.16),rgba(239,68,68,.1));font-weight:800;font-size:14px}
.streak i{font-style:normal;font-size:24px}
.bal{display:flex;align-items:center;gap:12px;cursor:pointer}
.bal .bi{flex:1;min-width:0}
.bal .bv{font-size:24px;font-weight:800;color:var(--pay);margin:2px 0}
.bal small{color:var(--mute);font-size:12px;display:block}
.btn-sm{background:var(--pay);color:#fff;border:0;padding:11px 13px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 5px 14px rgba(14,165,233,.35);white-space:nowrap}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:pan-y}
.cal .wd{text-align:center;font-size:11px;color:var(--mute);font-weight:700;padding-bottom:4px}
.cal .d{aspect-ratio:1/1.1;border-radius:13px;border:0;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;position:relative;padding:0;line-height:1.15}
.cal .d small{font-size:9px;font-weight:700;opacity:.92}
.cal .d.e{background:transparent;pointer-events:none}
.cal .d.today{outline:2.5px solid var(--pri);outline-offset:-2.5px}
.cal .d:active{transform:scale(.92)}
.cal .d.Present{background:var(--Present);color:#fff}
.cal .d.Half{background:var(--Half);color:#fff}
.cal .d.Absent{background:var(--Absent);color:#fff}
.cal .d.Holiday{background:var(--Holiday);color:#fff}
.cal .d.multi::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* list */
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 66px}
.item.first{border-top:0}
.item:active{opacity:.6}
.dt{width:48px;height:52px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex:none}
.dt b{font-size:19px;line-height:1}.dt span{font-size:10px;opacity:.92;margin-top:3px;font-weight:600}
.dt.Present{background:var(--Present)}.dt.Half{background:var(--Half)}.dt.Absent{background:var(--Absent)}.dt.Holiday{background:var(--Holiday)}.dt.Pay{background:var(--pay)}
.mid{flex:1;min-width:0}
.mid .s{font-weight:800;font-size:14px}
.mid .n{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amt{text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
.amt.pos{color:var(--pay)}
.amt small{display:block;font-weight:700;font-size:11px;color:var(--accent)}
.amt small.neg{color:var(--Absent)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;font-size:14px;line-height:1.6}
.empty .big{font-size:42px;display:block;margin-bottom:6px}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pager button{width:42px;height:42px;border-radius:14px;border:0;background:var(--soft);display:grid;place-items:center}
.pager button:disabled{opacity:.3}
.pager span{font-size:13px;font-weight:700;color:var(--mute)}
.linkbtn{width:100%;margin-top:12px;padding:13px;border-radius:15px;border:0;background:rgba(15,118,110,.1);color:var(--pri);font-weight:800;font-size:14px}
/* entries tab */
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--shadow);margin-top:14px}
.seg2 button{border:0;background:none;padding:11px;border-radius:12px;font-weight:800;font-size:14px;color:var(--mute)}
.seg2 button.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip2{padding:8px 14px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:700;white-space:nowrap;border:0;color:var(--mute)}
.chip2.on{background:var(--pri);color:#fff}
.chip2.s-Present.on{background:var(--Present)}.chip2.s-Half.on{background:var(--Half)}.chip2.s-Absent.on{background:var(--Absent)}.chip2.s-Holiday.on{background:var(--Holiday)}
.search{width:100%;padding:13px 14px;border-radius:15px;border:1px solid var(--line);background:var(--soft);color:var(--ink);margin-bottom:10px}
.sumline{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 0;font-size:13px;font-weight:700;color:var(--mute)}
.sumline b{color:var(--pri);font-size:16px}
.ghd{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 4px;margin-top:10px;font-weight:800;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line)}
.ghd span{color:var(--mute);font-weight:700}
.gcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 14px;margin-top:4px}
/* report */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:17px;padding:14px}
.stat span{font-size:11.5px;color:var(--mute);display:block;font-weight:600}
.stat b{font-size:19px;display:block;margin-top:3px;font-weight:800}
.donutwrap{display:flex;align-items:center;gap:18px}
.donutwrap svg{width:128px;height:128px;flex:none}
.dleg{flex:1;display:grid;gap:8px}
.dleg div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.dleg i{width:11px;height:11px;border-radius:4px;flex:none}
.dleg em{margin-left:auto;font-style:normal;color:var(--mute)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:9px;font-family:inherit}
.btn{border:0;border-radius:15px;padding:14px 16px;font-weight:800;font-size:14px;background:var(--soft);color:var(--ink);width:100%;text-align:left;display:flex;align-items:center;gap:10px;margin-top:8px}
.btn.danger{color:var(--Absent)}
.btn.pri{background:var(--pri);color:#fff;justify-content:center;text-align:center}
.btn.out{background:none;border:2px solid var(--pri);color:var(--pri);justify-content:center}
/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label{font-size:14px;font-weight:700;flex:1}
.row small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.seg{display:flex;background:var(--soft);border-radius:13px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 11px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--pri);color:#fff}
.inl{width:120px;padding:11px;border-radius:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:700;text-align:right}
.inl.txt{text-align:left;width:150px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;z-index:2;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--pri)}
.sw input:checked+span::after{transform:translateX(22px)}
footer{text-align:center;color:var(--mute);font-size:13px;padding:28px 16px 8px}
footer b{color:var(--pri);font-weight:800}
footer span{display:block;margin-top:5px;font-size:11px;opacity:.7}
/* nav */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card);border-radius:26px;box-shadow:0 10px 34px rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px;z-index:20;border:1px solid var(--line);align-items:center}
nav.tabs button.tb{border:0;background:transparent;border-radius:17px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--mute);min-width:0}
nav.tabs button.tb span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button.tb.on{color:var(--pri);background:rgba(20,184,166,.14)}
nav.tabs button.plus{justify-self:center;width:58px;height:58px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;transform:translateY(-20px);box-shadow:0 10px 24px rgba(15,118,110,.5)}
nav.tabs button.plus:active{transform:translateY(-20px) scale(.92)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* dialogs */
dialog{border:0;border-radius:28px 28px 0 0;padding:0;width:100%;max-width:520px;margin:auto auto 0;background:var(--card);color:var(--ink);max-height:94vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.52);backdrop-filter:blur(2px)}
dialog[open]{animation:up .26s ease}
@keyframes up{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
form,.dbody{padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px}
form h2,.dbody h2{margin:0;font-size:20px;font-weight:800}
.f{display:grid;gap:5px}
.f>span{font-size:12px;color:var(--mute);font-weight:700}
.f input[type=date],.f input[type=number],.f input[type=text]{padding:13px;border-radius:15px;border:1px solid var(--line);background:var(--soft);color:var(--ink);width:100%}
.dayl{font-size:13px;color:var(--pri);font-weight:800;margin-top:2px}
.stsel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stsel button{border:2px solid transparent;background:var(--soft);border-radius:15px;padding:11px 2px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px}
.stsel button em{font-style:normal}
.stsel button i{width:12px;height:12px;border-radius:50%}
.stsel button.on{border-color:currentColor;background:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nchips{display:flex;gap:7px;flex-wrap:wrap}
.nchips button{border:0;background:var(--soft);padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700}
.multi{background:var(--soft);border-radius:16px;padding:12px;display:grid;gap:10px}
.multi label.ck{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.multi label.ck input{width:20px;height:20px;accent-color:var(--pri)}
.mbtn{border:0;background:none;color:var(--pri);font-weight:800;font-size:13px;text-align:left;padding:0}
.acts{display:flex;gap:10px}
.acts button{flex:1;padding:15px;border-radius:15px;border:0;font-weight:800;font-size:15px}
.acts .save{background:var(--pri);color:#fff;flex:2}
.acts .cancel{background:var(--soft)}
.acts .del{flex:0 0 54px;background:rgba(239,68,68,.14);color:var(--Absent);display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0e2825;color:#fff;padding:12px 16px;border-radius:15px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;gap:14px;align-items:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#5eead4;font-weight:800}
dialog.small{border-radius:24px;margin:auto;max-width:340px}
dialog.small .dbody p{margin:0;font-size:15px;line-height:1.5;font-weight:600}
/* statement */
.stm table{width:100%;border-collapse:collapse;font-size:12.5px}
.stm th,.stm td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.stm td:first-child{white-space:nowrap}
.stm th{font-size:11px;color:var(--mute);text-transform:uppercase}
.stm td.n,.stm th.n{text-align:right}
.stm .tot td{font-weight:800;border-top:2px solid var(--ink)}
.stm h4{margin:0 0 4px;font-size:16px}
.stm .meta{color:var(--mute);font-size:12.5px;margin-bottom:10px}
.stm .sums{margin-top:12px;display:grid;gap:6px;font-size:14px;font-weight:700}
.stm .sums div{display:flex;justify-content:space-between}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:18px;background:#fff;color:#000}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px}
  #printArea th,#printArea td{border-bottom:1px solid #bbb;padding:6px;text-align:left}
  #printArea .n{text-align:right}
  #printArea h4{font-size:20px;margin:0 0 4px}
  #printArea .meta{color:#444;margin-bottom:12px}
  #printArea .sums div{display:flex;justify-content:space-between;font-weight:700;padding:3px 0}
  #printArea .tot td{font-weight:800;border-top:2px solid #000}
}
</style>
</head>
<body class="t-home">

<div class="hdr">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h7M8 13h7M8 17h4"/></svg></div>
      <div><h1>Work Ledger</h1><small id="subtitle"></small></div>
    </div>
    <div class="acts-h">
      <button class="ib" id="eyeBtn" aria-label="hide amounts"><svg class="i" viewBox="0 0 24 24" id="eyeSvg"></svg></button>
      <button class="ib" id="langQuick" aria-label="language">🌐 <span id="langCode">MI</span></button>
    </div>
  </div>
  <div class="mnav">
    <button class="arr" id="prev" aria-label="previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="lbl" id="mBtn"><b id="mLabel"></b><span id="mSub"></span></button>
    <button class="arr" id="next" aria-label="next"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <h2 id="pageTitle"></h2>
</div>

<div class="hero">
  <div class="hero-top">
    <div>
      <div class="k" id="tLabel"></div>
      <div class="v" id="sTotal">₹0</div>
      <div class="delta" id="delta" style="display:none"></div>
    </div>
    <div id="goalSlot"></div>
  </div>
  <div class="minis">
    <div class="mini"><b id="sDays">0</b><span id="lDays"></span></div>
    <div class="mini"><b id="sWage">₹0</b><span id="lWage"></span></div>

function setHero(v){
  const el=$('sTotal');const from=shownTotal;shownTotal=v;
  if(S.hide||from===v){el.textContent=inr(v);return}
  const t0=performance.now();const id=(setHero.id=(setHero.id||0)+1);
  (function step(now){if(setHero.id!==id)return;const p=Math.min(1,(now-t0)/420),e=1-Math.pow(1-p,3);el.textContent=inr(from+(v-from)*e);if(p<1)requestAnimationFrame(step);else el.textContent=inr(v)})(t0);
}
function calcStreak(){
  const work=new Set(),hol=new Set();
  data.forEach(r=>{if(r.status==='Present'||r.status==='Half Day')work.add(r.date);else if(r.status==='Holiday')hol.add(r.date)});
  const d=new Date();d.setHours(0,0,0,0);let n=0;
  if(!work.has(ymd(d))&&!hol.has(ymd(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<900;i++){const s=ymd(d);if(work.has(s))n++;else if(!hol.has(s))break;d.setDate(d.getDate()-1)}
  return n;
}
function renderHome(y,m){
  const rows=monthRows(y,m),s=sum(rows);
  setHero(s.t);
  $('sDays').textContent=fmtDays(s.d);$('sWage').textContent=inr(s.w);$('sExtra').textContent=inr(s.x);
  // delta vs last month
  const pm=new Date(y,m-1,1),ps=sum(monthRows(pm.getFullYear(),pm.getMonth()));
  const dl=$('delta');
  if(ps.t>0&&!S.hide){const pc=(s.t-ps.t)/ps.t*100;dl.style.display='';dl.className='delta '+(pc>=0?'up':'down');dl.textContent=`${pc>=0?'▲':'▼'} ${Math.abs(Math.round(pc))}% ${t('vsLast')}`}
  else dl.style.display='none';

  if(S.goal>0){
    const p=Math.min(1,s.t/S.goal),C=2*Math.PI*28;
    gs.innerHTML=`<div class="ring" title="${esc(tn('goalOf',inr(S.goal)).replace('{g}',inr(S.goal)))}"><svg viewBox="0 0 66 66"><circle cx="33" cy="33" r="28" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="33" cy="33" r="28" fill="none" stroke="${p>=1?'var(--accent)':'var(--pri2)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><b>${Math.round(s.t/S.goal*100)}%</b></div>`;
  }else gs.innerHTML=`<button class="goalbtn" id="goalBtn" aria-label="${esc(t('goalSet'))}">🎯</button>`;
  const gb=$('goalBtn');if(gb)gb.onclick=()=>{setTab('set');setTimeout(()=>$('goalIn').focus(),350)};
  // quick / streak
  const now=new Date(),isCur=now.getFullYear()===y&&now.getMonth()===m,has=data.some(r=>r.date===ymd(now));

}
function renderCal(y,m,rows){
  const ws=S.week,first=(new Date(y,m,1).getDay()-ws+7)%7,dim=new Date(y,m+1,0).getDate(),today=ymd(new Date());
  let h='';for(let i=0;i<7;i++)h+=`<div class="wd">${esc(wdShort((ws+i)%7))}</div>`;
  for(let i=0;i<first;i++)h+='<div class="d e"></div>';
  for(let d=1;d<=dim;d++){
    const ds=pref(y,m)+'-'+pad(d),ents=rows.filter(r=>r.date===ds);
    const cls=['d'];if(ents.length){cls.push(sk(ents[0].status));if(ents.length>1)cls.push('multi')}
    if(ds===today)cls.push('today');
    const amt=ents.length?`<small>${kfmt(ents.reduce((a,r)=>a+tot(r),0))}</small>`:'';
    h+=`<button class="${cls.join(' ')}" data-d="${ds}">${d}${amt}</button>`;
  }
  $('cal').innerHTML=h;
}

function renderHomeList(rows){

  if(S.homePage>=pages)S.homePage=pages-1;if(S.homePage<0)S.homePage=0;

function periodFilter(dateStr){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(S.ePeriod==='year')return dateStr.startsWith(y+'-');
  if(S.ePeriod==='month')return dateStr.startsWith(pref(y,m));
  if(S.ePeriod==='last'){const p=new Date(y,m-1,1);return dateStr.startsWith(pref(p.getFullYear(),p.getMonth()))}
  return true;
}
function renderEntries(){
  [...$('eSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.eView));
  $('pChips').innerHTML=[['all','pAll'],['year','pYear'],['month','pMonth'],['last','pLast']].map(([v,k])=>`<button class="chip2${S.ePeriod===v?' on':''}" data-p="${v}">${esc(t(k))}</button>`).join('');
  const isWork=S.eView==='work';
  $('sChips').style.display=isWork?'':'none';
  if(isWork)$('sChips').innerHTML=[['all','sAll'],['Present','Present'],['Half Day','Half Day'],['Absent','Absent'],['Holiday','Holiday']].map(([v,k])=>`<button class="chip2 s-${sk(v)}${S.eStatus===v?' on':''}" data-s="${v}">${esc(t(k))}</button>`).join('');
  if($('search').value!==S.eQuery)$('search').value=S.eQuery;
  const q=S.eQuery.trim().toLowerCase();
  let rows;
  if(isWork){
    rows=data.filter(r=>periodFilter(r.date)&&(S.eStatus==='all'||r.status===S.eStatus)&&(!q||r.note.toLowerCase().includes(q)||t(r.status).toLowerCase().includes(q)||r.status.toLowerCase().includes(q)||r.date.includes(q)));
  }else rows=pays.filter(r=>periodFilter(r.date)&&(!q||r.note.toLowerCase().includes(q)||r.date.includes(q)));
  rows.sort(sortDesc);
  const total=isWork?sum(rows).t:payTotal(rows);
  $('eCount').textContent=tn(isWork?'cnt':'cntPay',rows.length);$('eTotal').textContent=inr(total);
  if(!rows.length){$('eList').innerHTML=`<div class="card">${isWork?emptyHTML(t('none'),t('noneH')):emptyHTML(t('payNone'),t('payNoneH'))}</div>`;return}
  const groups=[];let last=null;
  rows.forEach(r=>{const k=r.date.slice(0,7);if(!last||last.k!==k){last={k,rows:[]};groups.push(last)}last.rows.push(r)});
  $('eList').innerHTML=groups.map(g=>{
    const y=+g.k.slice(0,4),m=+g.k.slice(5,7)-1;
    const gt=isWork?sum(g.rows).t:payTotal(g.rows);
    return `<div class="ghd">${esc(monLong(m))} ${y}<span>${g.rows.length} · ${inr(gt)}</span></div><div class="gcard">${g.rows.map((x,i)=>isWork?itemHTML(x,i===0):payHTML(x,i===0)).join('')}</div>`;
  }).join('');
}

/* ---- Report tab ---- */
function barChart(vals,labels,color,fmtTop,w=320,h=140){
  const max=Math.max(1,...vals),n=vals.length,bw=(w-20)/n,top=14,base=h-18;let g='';
  vals.forEach((v,i)=>{const bh=v>0?Math.max(3,(v/max)*(base-top)):0,x=10+i*bw;
    g+=`<rect x="${x+bw*.15}" y="${base-bh}" width="${bw*.7}" height="${bh}" rx="${Math.min(5,bw*.3)}" fill="${color}" opacity="${v>0?1:.16}"/>`;
    if(labels[i]!=='')g+=`<text x="${x+bw/2}" y="${h-4}" text-anchor="middle">${esc(labels[i])}</text>`;});
  g+=`<text x="10" y="9">${esc(fmtTop?fmtTop(max):inr(max))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}<line x1="10" x2="${w-10}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg>`;
}
function donut(counts){
  const keys=['Present','Half Day','Absent','Holiday'],total=keys.reduce((a,k)=>a+(counts[k]||0),0),r=40,C=2*Math.PI*r;
  let off=0,segs='';
  if(total)keys.forEach(k=>{const n=counts[k]||0;if(!n)return;const len=n/total*C;segs+=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--${sk(k)})" stroke-width="14" stroke-dasharray="${Math.max(0,len-1.5)} ${C-Math.max(0,len-1.5)}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=len});
  const svg=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/>${segs}<text x="50" y="54" text-anchor="middle" style="font-size:20px;font-weight:800;fill:var(--ink)">${total}</text></svg>`;
  const leg=keys.map(k=>`<div><i style="background:var(--${sk(k)})"></i>${esc(t(k))}<em>${counts[k]||0}${total?` · ${Math.round((counts[k]||0)/total*100)}%`:''}</em></div>`).join('');
  return `<div class="donutwrap">${svg}<div class="dleg">${leg}</div></div>`;
}
function renderReport(y,m){
  const rows=monthRows(y,m),s=sum(rows);
  $('brk').innerHTML=donut(s.c);
  const dim=new Date(y,m+1,0).getDate(),dv=[],dl=[];
  for(let d=1;d<=dim;d++){const ds=pref(y,m)+'-'+pad(d);dv.push(rows.filter(r=>r.date===ds).reduce((a,r)=>a+tot(r),0));dl.push(d===1||d%5===0?String(d):'')}
  $('dayChartTitle').textContent=t('dayChart')+' · '+monLong(m);
  $('dayChart').innerHTML=barChart(dv,dl,'var(--pri2)',S.hide?()=>'••••':null);
  const mv=[],ml=[];for(let i=0;i<12;i++){mv.push(sum(monthRows(y,i)).t);ml.push(monShort(i))}
  $('monChartTitle').textContent=t('monChart')+' · '+y;
  $('monChart').innerHTML=barChart(mv,ml,'var(--pri)',S.hide?()=>'••••':null);
  // weekday average (worked days only)
  const wsum=Array(7).fill(0),wcnt=Array(7).fill(0);
  data.forEach(r=>{if(r.status==='Present'||r.status==='Half Day'){const d=dateObj(r.date).getDay();wsum[d]+=tot(r);wcnt[d]++}});
  const order=[...Array(7).keys()].map(i=>(S.week+i)%7);
  $('wdChart').innerHTML=barChart(order.map(d=>wcnt[d]?wsum[d]/wcnt[d]:0),order.map(d=>wdShort(d)),'var(--accent)',S.hide?()=>'••••':null);
  // summary tiles
  const yearRows=data.filter(r=>r.date.startsWith(y+'-')),ys=sum(yearRows),as=sum(data);
  const best=rows.reduce((b,r)=>tot(r)>(b?tot(b):-1)?r:b,null);
  const counted=(s.c['Present']||0)+(s.c['Half Day']||0)+(s.c['Absent']||0);
  const att=counted?Math.round(((s.c['Present']||0)+(s.c['Half Day']||0))/counted*100)+'%':'—';
  const now=new Date(),isCur=now.getFullYear()===y&&now.getMonth()===m;
  const est=isCur&&s.t>0?inr(s.t/now.getDate()*dim):'—';
  const tiles=[[t('avg'),s.d?inr(s.t/s.d):'—'],[t('best'),best?inr(tot(best)):'—'],[t('attendance'),att],[t('est'),est],[t('streakLbl'),calcStreak()+' 🔥'],[t('yearTot')+' ('+y+')',inr(ys.t)],[t('allTot'),inr(as.t)],[t('received'),inr(payTotal(pays))]];
  $('sumGrid').innerHTML=tiles.map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('');
}

/* ============ Tabs / navigation ============ */
function setTab(tab,push=true){
  S.tab=tab;document.body.className='t-'+tab;
  document.querySelectorAll('nav.tabs .tb').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab));
  if(push)safe(()=>history.pushState({tab},''));
  renderActive();scrollTo({top:0,behavior:'auto'});
}
document.querySelectorAll('nav.tabs .tb').forEach(b=>b.onclick=()=>{if(S.tab!==b.dataset.tab)setTab(b.dataset.tab);else scrollTo({top:0,behavior:'smooth'})});
window.addEventListener('popstate',e=>{
  let closed=false;document.querySelectorAll('dialog[open]').forEach(d=>{d.close();closed=true});
  const tb=(e.state&&e.state.tab)||'home';if(!closed||tb!==S.tab)setTab(tb,false);
});
safe(()=>history.replaceState({tab:'home'},''));
const go=n=>{cur.setMonth(cur.getMonth()+n);S.homePage=0;renderActive()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('mBtn').onclick=()=>{const n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);S.homePage=0;renderActive()};
let sx=null;
document.addEventListener('touchstart',e=>{sx=e.target.closest('#cal')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>70)go(dx<0?1:-1)},{passive:true});

/* ============ Entry form ============ */
function setStatus(s){draftStatus=s;[...$('stsel').children].forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
function recalc(){$('fWage').value=Math.round((+$('fRate').value||0)*factor[draftStatus]*100)/100}
const updDay=()=>$('fDay').textContent=fmtLong($('fDate').value);
function renderNoteChips(){
  const cnt={};data.forEach(r=>{if(r.note)cnt[r.note]=(cnt[r.note]||0)+1});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
  $('nchips').innerHTML=top.map(n=>`<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('');
}
function openForm(r,dateStr){
  editing=r||null;multiOn=false;
  $('dTitle').textContent=r?t('editE'):t('newE');
  $('fDate').value=r?r.date:(dateStr||ymd(new Date()));updDay();
  setStatus(r?r.status:'Present');
  $('fRate').value=r?(r.rate||S.rate):S.rate;
  $('fWage').value=r?r.wage:S.rate;
  $('fExtra').value=r?r.extra:0;
  $('fNote').value=r?r.note:'';
  $('fDel').style.display=r?'':'none';
  $('multiWrap').style.display=r?'none':'';$('multiBox').style.display='none';$('fTo').value='';$('fSkip').checked=true;
  renderNoteChips();
  $('dlg').showModal();
}
$('stsel').onclick=e=>{const b=e.target.closest('button');if(!b)return;setStatus(b.dataset.s);recalc();buzz()};
$('fRate').oninput=recalc;
$('fDate').onchange=updDay;
$('nchips').onclick=e=>{const b=e.target.closest('button');if(b)$('fNote').value=b.dataset.n};
$('multiBtn').onclick=()=>{multiOn=!multiOn;$('multiBox').style.display=multiOn?'':'none';if(multiOn&&!$('fTo').value)$('fTo').value=$('fDate').value};
$('add').onclick=()=>openForm();
$('fCancel').onclick=()=>$('dlg').close();
document.querySelectorAll('dialog:not(.small)').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
function goalCheck(ds){
  if(!(S.goal>0))return;
  const y=+ds.slice(0,4),m=+ds.slice(5,7)-1,total=sum(monthRows(y,m)).t,fk='workledger.goalhit.'+pref(y,m);
  if(total>=S.goal){if(!lsGet(fk,null)){lsSet(fk,'1');setTimeout(()=>toast(t('goalHit')),700)}}
  else safe(()=>localStorage.removeItem(fk));
}
$('f').onsubmit=e=>{
  e.preventDefault();
  const date=$('fDate').value;if(!validDate(date))return;
  const base={status:draftStatus,rate:+$('fRate').value||0,wage:+$('fWage').value||0,extra:+$('fExtra').value||0,note:$('fNote').value.trim()};
  if(!editing&&multiOn&&$('fTo').value){
    const to=$('fTo').value;if(to<date){toast(t('badRange'));return}
    const d=dateObj(date),end=dateObj(to);let n=0;
    for(let i=0;d<=end&&i<93;i++,d.setDate(d.getDate()+1)){
      if($('fSkip').checked&&d.getDay()===0)continue;
      const ds=ymd(d);if(data.some(r=>r.date===ds))continue;
      data.push({id:uid(),date:ds,...base});n++;
    }
    saveD();$('dlg').close();cur=dateObj(date);cur.setDate(1);S.homePage=0;renderActive();toast('✓ '+tn('added',n));goalCheck(date);buzz();return;
  }
  const r={id:editing?editing.id:uid(),date,...base};
  if(editing){const i=data.indexOf(editing);if(i>-1)data[i]=r}else data.push(r);
  saveD();$('dlg').close();
  if(S.tab==='home'||S.tab==='report'){cur=dateObj(date);cur.setDate(1)}
  S.homePage=0;renderActive();toast('✓ '+t('saved'));goalCheck(date);buzz();
};
$('fDel').onclick=async()=>{
  if(!editing)return;const old=editing;
  if(!(await ask(t('delQ'),t('delBtn'))))return;
  data=data.filter(r=>r!==old);saveD();$('dlg').close();renderActive();
  toast(t('deleted'),()=>{data.push(old);saveD();renderActive()});
};

/* ============ Payment form ============ */
function openPay(p){
  editingPay=p||null;
  $('pTitle').textContent=p?t('payTitleEdit'):t('payTitleNew');
  $('pDate').value=p?p.date:ymd(new Date());$('pAmt').value=p?p.amount:'';$('pNote').value=p?p.note:'';
  $('pDel').style.display=p?'':'none';
  $('pdlg').showModal();
}
$('pCancel').onclick=()=>$('pdlg').close();
$('addPayBtn').onclick=e=>{e.stopPropagation();openPay()};
$('balCard').onclick=()=>{S.eView='pay';S.ePeriod='all';S.eQuery='';setTab('entries')};
$('pf').onsubmit=e=>{
  e.preventDefault();
  const date=$('pDate').value,amount=+$('pAmt').value;if(!validDate(date)||!(amount>0))return;
  const r={id:editingPay?editingPay.id:uid(),date,amount,note:$('pNote').value.trim()};
  if(editingPay){const i=pays.indexOf(editingPay);if(i>-1)pays[i]=r}else pays.push(r);
  savePays();
};
function savePays(){saveP();$('pdlg').close();renderActive();toast('✓ '+t('saved'));buzz()}
$('pDel').onclick=async()=>{
  if(!editingPay)return;const old=editingPay;
  if(!(await ask(t('delQ'),t('delBtn'))))return;
  pays=pays.filter(r=>r!==old);saveP();$('pdlg').close();renderActive();
  toast(t('deleted'),()=>{pays.push(old);saveP();renderActive()});
};

/* ============ Interactions ============ */
$('cal').onclick=e=>{const b=e.target.closest('.d[data-d]');if(!b)return;const ds=b.dataset.d;openForm(data.find(r=>r.date===ds),ds);buzz()};
document.addEventListener('click',e=>{
  const it=e.target.closest('.item');if(!it)return;
  if(it.dataset.pid){openPay(pays.find(r=>r.id===it.dataset.pid));return}
  if(it.dataset.id)openForm(data.find(r=>r.id===it.dataset.id));
});
$('viewAll').onclick=()=>{S.eView='work';S.ePeriod='all';S.eStatus='all';S.eQuery='';setTab('entries')};
$('quickBtn').onclick=()=>{
  const d=ymd(new Date());
  data.push({id:uid(),date:d,status:'Present',rate:S.rate,wage:S.rate,extra:0,note:''});
  saveD();renderActive();toast('✓ '+t('marked'));goalCheck(d);buzz();
};
$('eSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.eView=b.dataset.v;renderEntries()};
$('pChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.ePeriod=b.dataset.p;renderEntries()};
$('sChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.eStatus=b.dataset.s;renderEntries()};
$('search').oninput=e=>{S.eQuery=e.target.value;renderEntries()};
$('langQuick').onclick=()=>{const o=['mi','en','hi'];setLang(o[(o.indexOf(lang)+1)%3])};
function setLang(l){lang=S.lang=l;lsSet('workledger.lang',l);applyLang();renderActive()}
$('segLang').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.v)};
$('segTheme').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.theme=b.dataset.v;lsSet('workledger.theme',S.theme);applyTheme();applyLang()};
$('segWeek').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.week=+b.dataset.v;lsSet('workledger.week',S.week);applyLang();renderActive()};
$('nameIn').onchange=e=>{S.name=e.target.value.trim();lsSet('workledger.name',S.name);applyLang()};
$('rateIn').onchange=e=>{S.rate=+e.target.value||800;lsSet('workledger.rate',S.rate);e.target.value=S.rate;toast('✓ '+t('saved'))};
$('goalIn').onchange=e=>{S.goal=Math.max(0,+e.target.value||0);lsSet('workledger.goal',S.goal);e.target.value=S.goal||'';toast('✓ '+t('saved'))};
function setHide(v){S.hide=v;lsSet('workledger.hide',v?'1':'0');$('eyeSvg').innerHTML=v?EYE_OFF:EYE_ON;$('hideIn').checked=v;shownTotal=0;renderActive()}
$('hideIn').onchange=e=>setHide(e.target.checked);
$('eyeBtn').onclick=()=>setHide(!S.hide);

/* ============ Statement / share ============ */
function monthSummaryText(y,m){
  const s=sum(monthRows(y,m)),recv=payTotal(monthPays(y,m));
  return `📒 ${t('shareHdr')}${S.name?' — '+S.name:''}\n${monLong(m)} ${y}\n${t('workDays')}: ${fmtDays(s.d)}\n${t('wage')}: ${inr(s.w)}\n${t('extra')}: ${inr(s.x)}\n${t('total')}: ${inr(s.t)}\n${t('stRecv')}: ${inr(recv)}`;
}
function stmtHTML(y,m){
  const rows=monthRows(y,m).sort(sortAsc),s=sum(rows),recv=payTotal(monthPays(y,m));
  const bal=sum(data).t-payTotal(pays);
  const body=rows.map(r=>{const d=dateObj(r.date);return `<tr><td>${d.getDate()} ${esc(wdShort(d.getDay()))}</td><td>${esc(t(r.status))}</td><td>${esc(r.note)}</td><td class="n">${inr(r.wage)}</td><td class="n">${r.extra?inr(r.extra):''}</td><td class="n">${inr(tot(r))}</td></tr>`}).join('');
  return `<h4>${esc(t('stTitle'))}</h4><div class="meta">${S.name?esc(t('stName'))+': <b>'+esc(S.name)+'</b> · ':''}${esc(monLong(m))} ${y}</div>
  <table><thead><tr><th>${esc(t('stDate'))}</th><th>${esc(t('stStatus'))}</th><th>${esc(t('stNote'))}</th><th class="n">${esc(t('stWage'))}</th><th class="n">${esc(t('stExtra'))}</th><th class="n">${esc(t('stTotal'))}</th></tr></thead>
  <tbody>${body||`<tr><td colspan="6" style="text-align:center;color:#888">—</td></tr>`}<tr class="tot"><td colspan="3">${esc(t('days'))}: ${fmtDays(s.d)}</td><td class="n">${inr(s.w)}</td><td class="n">${inr(s.x)}</td><td class="n">${inr(s.t)}</td></tr></tbody></table>
  <div class="sums"><div><span>${esc(t('stMonthTotal'))}</span><span>${inr(s.t)}</span></div><div><span>${esc(t('stRecv'))}</span><span>${inr(recv)}</span></div><div><span>${esc(t('stBal'))}</span><span>${inr(bal)}</span></div></div>`;
}
$('stmtBtn').onclick=()=>{$('stmBody').innerHTML=stmtHTML(cur.getFullYear(),cur.getMonth());$('sdlg').showModal()};
$('stmClose').onclick=()=>$('sdlg').close();
$('stmPrint').onclick=()=>{$('printArea').innerHTML=stmtHTML(cur.getFullYear(),cur.getMonth());try{window.print()}catch(e){toast(t('badFile'))}};
async function shareText(txt){
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);toast('✓ Copied')}catch(e){prompt('',txt)}
}
$('shareBtn').onclick=()=>shareText(monthSummaryText(cur.getFullYear(),cur.getMonth()));
$('stmShare').onclick=()=>shareText(monthSummaryText(cur.getFullYear(),cur.getMonth()));

/* ============ Export / Import ============ */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
$('expCsv').onclick=()=>{
  const lines=['"Date","Status","Calculated Wage","Extra Amount","Note"',...[...data].sort(sortAsc).map(r=>[r.date,r.status,r.wage,r.extra,r.note].map(q).join(','))];
  download('WorkLedger-'+ymd(new Date())+'.csv','﻿'+lines.join('\n'),'text/csv');
};
$('impCsv').onclick=()=>$('fileCsv').click();
function parseCsvLine(l){const out=[];let c='',inq=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(inq){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else inq=false}else c+=ch}
  else if(ch==='"')inq=true;else if(ch===','){out.push(c);c=''}else c+=ch}
  out.push(c);return out}
$('fileCsv').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let n=0;
  try{
    const txt=(await f.text()).replace(/^﻿/,'');
    txt.split(/\r?\n/).slice(1).filter(Boolean).forEach(l=>{
      const c=parseCsvLine(l);if(!validDate(c[0]))return;
      const st=['Present','Half Day','Absent','Holiday'].includes(c[1])?c[1]:'Present';
      if(data.find(r=>r.date===c[0]&&r.note===(c[4]||'')&&r.status===st&&+r.wage===(+c[2]||0)&&+r.extra===(+c[3]||0)))return;
      data.push({id:uid(),date:c[0],status:st,rate:S.rate,wage:+c[2]||0,extra:+c[3]||0,note:c[4]||''});n++;
    });
    saveD();renderActive();toast('✓ '+tn('imported',n));
  }catch(err){toast(t('badFile'))}
  e.target.value='';
};
$('expJson').onclick=()=>download('WorkLedger-backup-'+ymd(new Date())+'.json',JSON.stringify({app:'workledger',v:3,settings:{rate:S.rate,lang:S.lang,theme:S.theme,name:S.name,goal:S.goal,week:S.week,hide:S.hide},data,pays},null,1),'application/json');
$('impJson').onclick=()=>$('fileJson').click();
$('fileJson').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(!Array.isArray(j.data))throw 0;
    if(!(await ask(t('restoreQ'),t('ok'))))return;
    data=j.data.filter(r=>r&&validDate(r.date)).map(normE);
    pays=(Array.isArray(j.pays)?j.pays:[]).filter(r=>r&&validDate(r.date)).map(normP);
    const st=j.settings||(j.rate?{rate:j.rate}:{});
    if(st.rate){S.rate=+st.rate||S.rate;lsSet('workledger.rate',S.rate)}
    if(typeof st.name==='string'){S.name=st.name;lsSet('workledger.name',S.name)}
    if(st.goal!=null){S.goal=+st.goal||0;lsSet('workledger.goal',S.goal)}
    saveD();saveP();applyLang();renderActive();toast('✓ '+t('restored'));
  }catch(err){toast(t('badFile'))}
};
$('clearAll').onclick=async()=>{
  if(!(await ask(t('clearQ'),t('delBtn'))))return;
  const od=data,op=pays;data=[];pays=[];saveD();saveP();renderActive();
  toast(t('deleted'),()=>{data=od;pays=op;saveD();saveP();renderActive()});
};

/* ============ Init ============ */
applyTheme();applyLang();setTab('home',false);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
