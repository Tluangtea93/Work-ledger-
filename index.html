<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Work Ledger</title>
<style>
:root{
  --bg:#f2f6f5;--card:#ffffff;--ink:#10302c;--mute:#678079;--line:#e1eae8;
  --pri:#0f766e;--pri2:#14b8a6;--accent:#f59e0b;
  --Present:#10b981;--Half:#f59e0b;--Absent:#ef4444;--Holiday:#6366f1;
  --shadow:0 6px 22px rgba(16,48,44,.09);--r:20px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0b1312;--card:#142220;--ink:#e8f3f1;--mute:#8aa39e;--line:#23352f;--shadow:0 6px 22px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0b1312;--card:#142220;--ink:#e8f3f1;--mute:#8aa39e;--line:#23352f;--shadow:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hdr{background:linear-gradient(140deg,#0b5f59 0%,var(--pri) 45%,var(--pri2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 86px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hdr::before{width:220px;height:220px;right:-70px;top:-90px}
.hdr::after{width:150px;height:150px;left:-50px;bottom:-60px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;backdrop-filter:blur(6px)}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:11px;opacity:.8;margin-top:1px}
.chip{background:rgba(255,255,255,.2);border:0;color:#fff;height:36px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:20px;position:relative;z-index:1}
.mnav button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
.mnav button:active{transform:scale(.92)}
.mnav .lbl{text-align:center}
.mnav .lbl b{font-size:22px;display:block;font-weight:700}
.mnav .lbl span{font-size:12px;opacity:.85}
.total{margin:-64px 16px 0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;z-index:2}
.total .k{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.total .v{font-size:34px;font-weight:800;color:var(--pri);margin:2px 0 12px;letter-spacing:-.5px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center}
.mini b{display:block;font-size:16px}
.mini span{font-size:11px;color:var(--mute)}
main{padding:0 16px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.quick{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,rgba(16,185,129,.14),rgba(20,184,166,.14));border:1px dashed var(--Present)}
.quick p{margin:0;flex:1;font-size:14px;font-weight:600}
.quick button{background:var(--Present);color:#fff;border:0;padding:11px 14px;border-radius:14px;font-weight:700;box-shadow:0 4px 12px rgba(16,185,129,.4)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:pan-y}
.cal .wd{text-align:center;font-size:11px;color:var(--mute);font-weight:700;padding-bottom:4px}
.cal .d{aspect-ratio:1/1.12;border-radius:12px;border:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;padding:0;line-height:1.15}
.cal .d small{font-size:9px;font-weight:600;opacity:.9}
.cal .d.e{background:transparent;pointer-events:none}
.cal .d.today{outline:2px solid var(--pri);outline-offset:-2px}
.cal .d:active{transform:scale(.92)}
.cal .d.Present{background:var(--Present);color:#fff}
.cal .d.Half{background:var(--Half);color:#fff}
.cal .d.Absent{background:var(--Absent);color:#fff}
.cal .d.Holiday{background:var(--Holiday);color:#fff}
.cal .d.multi::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item:active{opacity:.6}
.dt{width:46px;height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex:none}
.dt b{font-size:18px;line-height:1}.dt span{font-size:10px;opacity:.9;margin-top:2px}
.dt.Present{background:var(--Present)}.dt.Half{background:var(--Half)}.dt.Absent{background:var(--Absent)}.dt.Holiday{background:var(--Holiday)}
.mid{flex:1;min-width:0}
.mid .s{font-weight:700;font-size:14px}
.mid .n{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amt{text-align:right;font-weight:800;font-size:15px}
.amt small{display:block;font-weight:600;font-size:11px;color:var(--accent)}
.amt small.neg{color:var(--Absent)}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px;line-height:1.6}
.empty .big{font-size:40px;display:block;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:16px;padding:14px}
.stat span{font-size:11.5px;color:var(--mute);display:block}
.stat b{font-size:20px;display:block;margin-top:2px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg);margin:6px 0 12px}
.bar div{height:100%}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:9px;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{font-size:14px;font-weight:600}
.row small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--pri);color:#fff}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px;background:var(--bg);color:var(--ink);width:100%;text-align:left;display:flex;align-items:center;gap:10px;margin-top:8px}
.btn.danger{color:var(--Absent)}
.btn.pri{background:var(--pri);color:#fff;justify-content:center;text-align:center}
input[type=number].inline{width:110px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;text-align:right}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:26px 16px 8px}
footer b{color:var(--pri);font-weight:700}
footer span{display:block;margin-top:4px;font-size:11px;opacity:.7}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;justify-content:space-around;padding:8px;z-index:20;border:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute)}
nav.tabs button.on{color:var(--pri);background:rgba(20,184,166,.14)}
.fab{position:fixed;right:22px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 22px rgba(15,118,110,.5);display:grid;place-items:center;z-index:21}
.fab:active{transform:scale(.92)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:26px 26px 0 0;padding:0;width:100%;max-width:520px;margin:auto auto 0;background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
dialog[open]{animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
form{padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px}
form h2{margin:0;font-size:19px}
.f{display:grid;gap:5px}
.f>span{font-size:12px;color:var(--mute);font-weight:600}
.f input{font:inherit;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.stsel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stsel button{border:2px solid transparent;background:var(--bg);border-radius:14px;padding:10px 2px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.stsel button em{font-style:normal}
.stsel button i{width:12px;height:12px;border-radius:50%}
.stsel button.on{border-color:currentColor;background:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px}
.acts button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:700;font-size:15px}
.acts .save{background:var(--pri);color:#fff;flex:2}
.acts .cancel{background:var(--bg)}
.acts .del{flex:0 0 52px;background:rgba(239,68,68,.14);color:var(--Absent)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#10302c;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;display:flex;gap:14px;align-items:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#5eead4;font-weight:800}
</style>
</head>
<body>

<div class="hdr">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h7M8 13h7M8 17h4"/></svg></div>
      <div><h1>Work Ledger</h1><small id="subtitle"></small></div>
    </div>
    <button class="chip" id="langQuick" aria-label="language">🌐 <span id="langCode">MI</span></button>
  </div>
  <div class="mnav">
    <button id="prev" aria-label="previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="lbl"><b id="mLabel"></b><span id="mSub"></span></div>
    <button id="next" aria-label="next"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<div class="total">
  <div class="k" id="tLabel"></div>
  <div class="v" id="sTotal">₹0</div>
  <div class="minis">
    <div class="mini"><b id="sDays">0</b><span id="lDays"></span></div>
    <div class="mini"><b id="sWage">₹0</b><span id="lWage"></span></div>
    <div class="mini"><b id="sExtra">₹0</b><span id="lExtra"></span></div>
  </div>
</div>

<main>
  <section class="view on" id="v-home">
    <div class="card quick" id="quick" style="display:none"><p id="quickTxt"></p><button id="quickBtn"></button></div>
    <div class="card">
      <h3 id="calTitle"></h3>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <h3><span id="listTitle"></span></h3>
      <input class="search" id="search" type="search">
      <div id="list"></div>
    </div>
  </section>

  <section class="view" id="v-stats">
    <div class="card">
      <h3 id="brkTitle"></h3>
      <div class="bar" id="brkBar"></div>
      <div class="grid2" id="brkGrid"></div>
    </div>
    <div class="card"><h3 id="dayChartTitle"></h3><div id="dayChart"></div></div>
    <div class="card"><h3 id="monChartTitle"></h3><div id="monChart"></div></div>
    <div class="card">
      <h3 id="sumTitle"></h3>
      <div class="grid2" id="sumGrid"></div>
      <button class="btn pri" id="shareBtn" style="margin-top:14px"></button>
    </div>
  </section>

  <section class="view" id="v-set">
    <div class="card">
      <div class="row"><label id="setLang"></label>
        <div class="seg" id="segLang"><button data-v="mi">Mizo</button><button data-v="en">English</button><button data-v="hi">हिन्दी</button></div></div>
      <div class="row"><label id="setTheme"></label>
        <div class="seg" id="segTheme"><button data-v="auto"></button><button data-v="light"></button><button data-v="dark"></button></div></div>
      <div class="row"><label><span id="setRate"></span><small id="setRateH"></small></label>
        <input class="inline" type="number" id="rateIn" inputmode="decimal"></div>
    </div>
    <div class="card">
      <h3 id="dataTitle"></h3>
      <button class="btn" id="expCsv"></button>
      <button class="btn" id="impCsv"></button>
      <button class="btn" id="expJson"></button>
      <button class="btn" id="impJson"></button>
      <button class="btn danger" id="clearAll"></button>
      <input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
      <input type="file" id="fileJson" accept=".json,application/json" hidden>
    </div>
    <div class="card" id="aboutCard"></div>
  </section>

  <footer><div id="foot"></div><span>Work Ledger v2.0</span></footer>
</main>

<button class="fab" id="add" aria-label="add"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px;stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs">
  <button data-tab="home" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span id="tabHome"></span></button>
  <button data-tab="stats"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span id="tabStats"></span></button>
  <button data-tab="set"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span id="tabSet"></span></button>
</nav>

<dialog id="dlg"><form id="f" method="dialog">
  <h2 id="dTitle"></h2>
  <label class="f"><span id="lDate"></span><input type="date" id="fDate" required></label>
  <div class="f"><span id="lStatus"></span>
    <div class="stsel" id="stsel">
      <button type="button" data-s="Present" style="color:var(--Present)"><i style="background:var(--Present)"></i><em></em></button>
      <button type="button" data-s="Half Day" style="color:var(--Half)"><i style="background:var(--Half)"></i><em></em></button>
      <button type="button" data-s="Absent" style="color:var(--Absent)"><i style="background:var(--Absent)"></i><em></em></button>
      <button type="button" data-s="Holiday" style="color:var(--Holiday)"><i style="background:var(--Holiday)"></i><em></em></button>
    </div>
  </div>
  <div class="two">
    <label class="f"><span id="lRate"></span><input type="number" id="fRate" inputmode="decimal"></label>
    <label class="f"><span id="lWageF"></span><input type="number" id="fWage" inputmode="decimal"></label>
  </div>
  <label class="f"><span id="lExtraF"></span><input type="number" id="fExtra" inputmode="decimal" value="0"></label>
  <label class="f"><span id="lNote"></span><input type="text" id="fNote" maxlength="120"></label>
  <div class="acts">
    <button type="button" class="del" id="fDel" aria-label="delete"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    <button type="button" class="cancel" id="fCancel"></button>
    <button class="save" type="submit" id="fSave"></button>
  </div>
</form></dialog>

<div id="toast"><span id="toastTxt"></span><button id="toastBtn" style="display:none"></button></div>

/* ---------- State ---------- */
const KEY='workledger.v1',RK='workledger.rate',LK='workledger.lang',TK='workledger.theme';
let data=safe(()=>JSON.parse(localStorage.getItem(KEY)),null)||[];
if(!Array.isArray(data))data=[];
let rate=+safe(()=>localStorage.getItem(RK),0)||800;
let lang=safe(()=>localStorage.getItem(LK),null)||'mi'; if(!T[lang])lang='mi';
let theme=safe(()=>localStorage.getItem(TK),null)||'auto';
let cur=new Date();cur.setDate(1);cur.setHours(0,0,0,0);
let editing=null,tab='home',query='',draftStatus='Present';
const t=k=>(T[lang][k]??T.en[k]??k);
const save=()=>safe(()=>localStorage.setItem(KEY,JSON.stringify(data)));
const inr=n=>(n<0?'-':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const factor={'Present':1,'Half Day':.5,'Absent':0,'Holiday':0};
const sk=s=>s==='Half Day'?'Half':s;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tot=r=>(+r.wage||0)+(+r.extra||0);
const monthRows=(y,m)=>data.filter(r=>r.date.startsWith(y+'-'+pad(m+1)));
const sum=rows=>rows.reduce((a,r)=>{a.w+=+r.wage||0;a.x+=+r.extra||0;a.t+=tot(r);
  if(r.status==='Present')a.d+=1;else if(r.status==='Half Day')a.d+=.5;a.c[r.status]=(a.c[r.status]||0)+1;return a},{w:0,x:0,t:0,d:0,c:{}});
const fmtDays=n=>Number.isInteger(n)?n:n.toFixed(1);
const dateObj=s=>new Date(s+'T00:00:00');
function longMonth(d){return d.toLocaleDateString(T[lang].locale,{month:'long'})}
function toast(msg,undoFn){
  const el=$('toast');$('toastTxt').textContent=msg;const b=$('toastBtn');
  if(undoFn){b.style.display='';b.textContent=t('undo');b.onclick=()=>{undoFn();el.classList.remove('show')}}else b.style.display='none';
  el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),undoFn?4500:2200);
}
const buzz=()=>safe(()=>navigator.vibrate&&navigator.vibrate(12));

/* ---------- Render ---------- */
function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const rows=monthRows(y,m);const s=sum(rows);
  $('mLabel').textContent=longMonth(cur);$('mSub').textContent=String(y);
  $('sTotal').textContent=inr(s.t);$('sDays').textContent=fmtDays(s.d);$('sWage').textContent=inr(s.w);$('sExtra').textContent=inr(s.x);
  renderQuick();renderCal(y,m,rows);renderList(rows);
  if(tab==='stats')renderStats(y,m,rows,s);
}
function renderQuick(){
  const now=new Date(),isCur=now.getFullYear()===cur.getFullYear()&&now.getMonth()===cur.getMonth();
  const has=data.some(r=>r.date===ymd(now));
  const q=$('quick');q.style.display=(isCur&&!has)?'flex':'none';
  $('quickTxt').textContent=t('quick');$('quickBtn').textContent='✓ '+t('quickBtn')+' · '+inr(rate);
}
function renderCal(y,m,rows){
  const first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),today=ymd(new Date());
  let h=T[lang].wd.map(w=>`<div class="wd">${esc(w)}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div class="d e"></div>';
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+pad(m+1)+'-'+pad(d),ents=rows.filter(r=>r.date===ds);
    const cls=['d'];if(ents.length){cls.push(sk(ents[0].status));if(ents.length>1)cls.push('multi')}
    if(ds===today)cls.push('today');
    const amt=ents.length?`<small>${ents.reduce((a,r)=>a+tot(r),0)}</small>`:'';
    h+=`<button class="${cls.join(' ')}" data-d="${ds}">${d}${amt}</button>`;
  }
  $('cal').innerHTML=h;
}
function renderList(rows){
  const q=query.trim().toLowerCase();
  let r=[...rows].sort((a,b)=>b.date.localeCompare(a.date));
  if(q)r=r.filter(x=>(x.note||'').toLowerCase().includes(q)||t(x.status).toLowerCase().includes(q)||x.status.toLowerCase().includes(q));
  $('list').innerHTML=r.length?r.map(x=>{const dt=dateObj(x.date);
    const wk=dt.toLocaleDateString(T[lang].locale,{weekday:'short'});
    const ex=+x.extra;
    return `<div class="item" data-id="${esc(x.id)}"><div class="dt ${sk(x.status)}"><b>${dt.getDate()}</b><span>${esc(wk)}</span></div>
      <div class="mid"><div class="s">${esc(t(x.status))}</div><div class="n">${esc(x.note)||'—'}</div></div>
      <div class="amt">${inr(tot(x))}${ex?`<small class="${ex<0?'neg':''}">${ex>0?'+':''}${inr(ex)} ${esc(t('extra'))}</small>`:''}</div></div>`}).join('')
    :`<div class="empty"><span class="big">📒</span>${esc(t('none'))}<br>${esc(t('noneH'))}</div>`;
}
function barChart(vals,labels,color,w=320,h=140){
  const max=Math.max(1,...vals),n=vals.length,bw=(w-20)/n,top=14,base=h-18;
  let g='';
  vals.forEach((v,i)=>{const bh=v>0?Math.max(3,(v/max)*(base-top)):0,x=10+i*bw;
    g+=`<rect x="${x+bw*.15}" y="${base-bh}" width="${bw*.7}" height="${bh}" rx="${Math.min(4,bw*.3)}" fill="${color}" opacity="${v>0?1:.18}"/>`;
    if(labels[i]!=='')g+=`<text x="${x+bw/2}" y="${h-4}" text-anchor="middle">${labels[i]}</text>`;});
  g+=`<text x="10" y="9">${inr(max)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}<line x1="10" x2="${w-10}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg>`;
}
function renderStats(y,m,rows,s){
  const cs={Present:0,'Half Day':0,Absent:0,Holiday:0};rows.forEach(r=>cs[r.status]=(cs[r.status]||0)+1);
  const n=Math.max(1,rows.length);
  $('brkBar').innerHTML=Object.keys(cs).filter(k=>cs[k]).map(k=>`<div style="width:${cs[k]/n*100}%;background:var(--${sk(k)})"></div>`).join('');
  $('brkGrid').innerHTML=Object.keys(cs).map(k=>`<div class="stat"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--${sk(k)});margin-right:5px"></i>${esc(t(k))}</span><b>${cs[k]}</b></div>`).join('');
  const dim=new Date(y,m+1,0).getDate(),dv=[],dl=[];
  for(let d=1;d<=dim;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d);dv.push(rows.filter(r=>r.date===ds).reduce((a,r)=>a+tot(r),0));dl.push(d===1||d%5===0?d:'')}
  $('dayChart').innerHTML=barChart(dv,dl,'var(--pri2)');
  const mv=[],ml=[];
  for(let i=0;i<12;i++){mv.push(sum(monthRows(y,i)).t);ml.push(new Date(y,i,1).toLocaleDateString(T[lang].locale,{month:'short'}).slice(0,3))}
  $('monChartTitle').textContent=t('monChart')+' · '+y;
  $('monChart').innerHTML=barChart(mv,ml,'var(--pri)');
  const yearRows=data.filter(r=>r.date.startsWith(y+'-')),ys=sum(yearRows),as=sum(data);
  const best=rows.reduce((b,r)=>tot(r)>(b?tot(b):-1)?r:b,null);
  $('sumGrid').innerHTML=[
    [t('avg'),s.d?inr(s.t/s.d):'—'],[t('best'),best?inr(tot(best)):'—'],
    [t('yearTot')+' ('+y+')',inr(ys.t)],[t('allTot'),inr(as.t)]
  ].map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('');
}

/* ---------- Form ---------- */
function setStatus(s){draftStatus=s;[...$('stsel').children].forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
function recalc(){$('fWage').value=Math.round((+$('fRate').value||0)*factor[draftStatus]*100)/100}
function openForm(r,dateStr){
  editing=r||null;
  $('dTitle').textContent=r?t('editE'):t('newE');
  $('fDate').value=r?r.date:(dateStr||ymd(new Date()));
  setStatus(r?r.status:'Present');
  $('fRate').value=r?(r.rate||rate):rate;
  $('fWage').value=r?r.wage:rate;
  $('fExtra').value=r?r.extra:0;
  $('fNote').value=r?r.note:'';
  $('fDel').style.display=r?'':'none';
  $('dlg').showModal();
}
$('stsel').onclick=e=>{const b=e.target.closest('button');if(!b)return;setStatus(b.dataset.s);recalc();buzz()};
$('fRate').oninput=recalc;
$('add').onclick=()=>openForm();
$('fCancel').onclick=()=>$('dlg').close();
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
$('f').onsubmit=()=>{
  const r={id:editing?editing.id:Date.now()+''+Math.random().toString(36).slice(2,6),date:$('fDate').value,status:draftStatus,
    rate:+$('fRate').value||0,wage:+$('fWage').value||0,extra:+$('fExtra').value||0,note:$('fNote').value.trim()};
  if(editing){const i=data.indexOf(editing);if(i>-1)data[i]=r}else data.push(r);
  save();cur=dateObj(r.date);cur.setDate(1);render();toast('✓ '+t('saved'));buzz();

$('fDel').onclick=()=>{
  if(!editing)return;const old=editing;
  if(!confirm(t('delQ')))return;
  data=data.filter(r=>r!==old);save();$('dlg').close();render();
  toast(t('deleted'),()=>{data.push(old);save();render()});
};

/* ---------- Share / Export / Import ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('shareBtn').onclick=async()=>{
  const rows=monthRows(cur.getFullYear(),cur.getMonth()),s=sum(rows);
  const txt=`📒 ${t('shareHdr')} — ${longMonth(cur)} ${cur.getFullYear()}\n${t('workDays')}: ${fmtDays(s.d)}\n${t('wage')}: ${inr(s.w)}\n${t('extra')}: ${inr(s.x)}\n${t('total')}: ${inr(s.t)}`;
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);toast('✓ Copied')}catch(e){prompt('',txt)}
};
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
$('expCsv').onclick=()=>{
  const lines=['"Date","Status","Calculated Wage","Extra Amount","Note"',...[...data].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,r.status,r.wage,r.extra,r.note].map(q).join(','))];
  download('WorkLedger-'+ymd(cur).slice(0,7)+'.csv','﻿'+lines.join('\n'),'text/csv');
};
$('impCsv').onclick=()=>$('fileCsv').click();
function parseCsvLine(l){const out=[];let cur='',inq=false;for(let i=0;i<l.length;i++){const c=l[i];
  if(inq){if(c==='"'){if(l[i+1]==='"'){cur+='"';i++}else inq=false}else cur+=c}
  else if(c==='"')inq=true;else if(c===','){out.push(cur);cur=''}else cur+=c}
  out.push(cur);return out}
$('fileCsv').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let n=0;
  try{
    const txt=(await f.text()).replace(/^﻿/,'');
    txt.split(/\r?\n/).slice(1).filter(Boolean).forEach(l=>{
      const c=parseCsvLine(l);if(!/^\d{4}-\d\d-\d\d$/.test(c[0]))return;
      const st=['Present','Half Day','Absent','Holiday'].includes(c[1])?c[1]:'Present';
      if(data.find(r=>r.date===c[0]&&r.note===(c[4]||'')&&r.status===st&&+r.wage===(+c[2]||0)))return;
      data.push({id:Date.now()+'i'+n++,date:c[0],status:st,rate:rate,wage:+c[2]||0,extra:+c[3]||0,note:c[4]||''});
    });
    save();render();toast('✓ '+n+' '+t('imported'));
  }catch(err){toast(t('badFile'))}
  e.target.value='';
};
$('expJson').onclick=()=>download('WorkLedger-backup-'+ymd(new Date())+'.json',JSON.stringify({app:'workledger',v:2,rate,lang,theme,data},null,1),'application/json');
$('impJson').onclick=()=>$('fileJson').click();
$('fileJson').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(!Array.isArray(j.data))throw 0;
    data=j.data.filter(r=>r&&/^\d{4}-\d\d-\d\d$/.test(r.date)).map(r=>({id:String(r.id||Date.now()+Math.random()),date:r.date,status:r.status||'Present',rate:+r.rate||0,wage:+r.wage||0,extra:+r.extra||0,note:r.note||''}));
    if(j.rate){rate=+j.rate;safe(()=>localStorage.setItem(RK,rate))}
    save();applyLang();render();toast('✓ '+t('restored'));
  }catch(err){toast(t('badFile'))}
  e.target.value='';
};
$('clearAll').onclick=()=>{if(confirm(t('clearQ'))){const old=data;data=[];save();render();toast(t('deleted'),()=>{data=old;save();render()})}};

/* ---------- Init ---------- */
applyTheme();applyLang();render();
$('add').style.display='';
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
